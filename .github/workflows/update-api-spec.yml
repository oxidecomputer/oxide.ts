name: Update API Spec

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: write # to push generated API updates

concurrency:
  group: api-spec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-api-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - working-directory: "./oxide-openapi-gen-ts"
        run: 'npm ci'
      - run: ./tools/gen.sh
      - uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          add: .
          message: "Autogenerate config update"
          default_author: github_actions
